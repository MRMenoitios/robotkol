<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <title>THE ORIGINAL™ - Yapay Görme</title>
    <style>
        :root {
            --neon-green: #00ff00;
            --neon-red: #ff003c;
            --neon-blue: #00f3ff;
            --bg-dark: rgba(0, 10, 0, 0.85);
            --glass: rgba(0, 20, 0, 0.6);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            overflow: hidden;
            font-family: 'Orbitron', 'Segoe UI', sans-serif;
            color: var(--neon-green);
        }

        /* 1. KATMAN: KAMERA */
        #cikisEkrani {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            filter: contrast(1.1) brightness(0.9);
        }

        /* Scanline efekti */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            pointer-events: none;
            z-index: 2;
        }

        /* Üst Panel */
        .ust-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid var(--neon-green);
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            z-index: 10;
        }

        .ust-panel h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px var(--neon-green);
        }

        .durum-grubu {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .durum-rozeti {
            padding: 5px 15px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .bagli {
            background-color: rgba(0, 255, 0, 0.1);
            color: var(--neon-green);
            border-color: var(--neon-green);
            box-shadow: inset 0 0 10px rgba(0, 255, 0, 0.2);
        }

        .kopuk {
            background-color: rgba(255, 0, 0, 0.1);
            color: var(--neon-red);
            border-color: var(--neon-red);
            box-shadow: inset 0 0 10px rgba(255, 0, 0, 0.2);
        }

        /* Yan Konsol */
        #konsol {
            position: absolute;
            right: 20px;
            top: 100px;
            width: 280px;
            bottom: 120px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-left: 2px solid var(--neon-green);
            padding: 15px;
            z-index: 10;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-green) transparent;
        }

        #konsol div {
            border-bottom: 1px solid rgba(0, 255, 0, 0.1);
            padding-bottom: 3px;
        }

        .konsol-vakit {
            color: #888;
            margin-right: 5px;
        }

        .konsol-mesaj-sistem {
            color: var(--neon-blue);
        }

        .konsol-mesaj-hata {
            color: var(--neon-red);
        }

        /* Alt Kontrol Paneli */
        #bilgiPaneli {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            backdrop-filter: blur(20px);
            border: 1px solid var(--neon-green);
            border-radius: 15px;
            padding: 20px;
            width: 500px;
            text-align: center;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
        }

        #secimMetni {
            font-size: 1.1rem;
            margin-bottom: 15px;
            min-height: 1.5em;
        }

        .bekliyor {
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .kilitli {
            color: var(--neon-red);
            text-shadow: 0 0 10px var(--neon-red);
            animation: blink 1s infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0.5;
            }
        }

        .buton-grubu {
            display: none;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            background: transparent;
            border: 1px solid var(--neon-green);
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.1);
            transition: 0.3s;
        }

        .btn:hover::before {
            left: 0;
        }

        .btn-onay {
            border-color: var(--neon-green);
            color: var(--neon-green);
        }

        .btn-iptal {
            border-color: var(--neon-red);
            color: var(--neon-red);
        }

        .btn-iptal:hover {
            background: rgba(255, 0, 0, 0.1);
        }

        /* HUD Elemanları */
        .hud-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border: 2px solid var(--neon-green);
            z-index: 5;
            pointer-events: none;
        }

        .top-left {
            top: 10px;
            left: 10px;
            border-right: none;
            border-bottom: none;
        }

        .top-right {
            top: 10px;
            right: 10px;
            border-left: none;
            border-bottom: none;
        }

        .bottom-left {
            bottom: 10px;
            left: 10px;
            border-right: none;
            border-top: none;
        }

        .bottom-right {
            bottom: 10px;
            right: 10px;
            border-left: none;
            border-top: none;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <script async src="https://docs.opencv.org/4.8.0/opencv.js" onload="sistemHazir();"></script>
    <script src="/socket.io/socket.io.js"></script>
</head>

<body>
    <div class="scanlines"></div>
    <div class="hud-corner top-left"></div>
    <div class="hud-corner top-right"></div>
    <div class="hud-corner bottom-left"></div>
    <div class="hud-corner bottom-right"></div>

    <video id="kamera" width="640" height="480" autoplay style="display: none;"></video>
    <canvas id="cikisEkrani" width="640" height="480"></canvas>

    <div class="ust-panel">
        <h1>KASTAMONU ÜNİVERSİTESİ <span style="font-size: 0.8rem; vertical-align: middle; opacity: 0.7;">Sistem Analizi
                ve Tasarımı Final Ödevi</span></h1>
        <div class="durum-grubu">
            <div id="fpsSayaci" style="font-size: 0.8rem; color: var(--neon-blue);">FPS: --</div>
            <div id="arduinoBaglanti" class="durum-rozeti kopuk">ARDUINO: OFFLINE</div>
        </div>
    </div>

    <div id="konsol">
        <div class="konsol-mesaj-sistem">> Sistem başlatılıyor...</div>
    </div>

    <div id="bilgiPaneli">
        <div id="secimMetni">Yapay Görme Modülü Yükleniyor...</div>
        <div id="butonlar" class="buton-grubu">
            <button id="btnOnay" class="btn btn-onay">KİLİTLEN VE GİT</button>
            <button id="btnIptal" class="btn btn-iptal">İPTAL</button>
        </div>
    </div>

    <script>
        const socket = io();
        const arduinoRozet = document.getElementById('arduinoBaglanti');
        const secimMetni = document.getElementById('secimMetni');
        const butonlarDiv = document.getElementById('butonlar');
        const canvas = document.getElementById('cikisEkrani');
        const video = document.getElementById('kamera');
        const konsol = document.getElementById('konsol');
        const fpsSayaci = document.getElementById('fpsSayaci');

        let islemBasladi = false, anlikHedefler = [], seciliHedefKodu = null, bekleyenHedef = null;
        let lastTime = 0, frameCount = 0;

        function logMesaj(mesaj, tip = 'sistem') {
            const div = document.createElement('div');
            const vakit = new Date().toLocaleTimeString('tr-TR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            div.innerHTML = `<span class="konsol-vakit">[${vakit}]</span> <span class="konsol-mesaj-${tip}">> ${mesaj}</span>`;
            konsol.prepend(div);
            if (konsol.childNodes.length > 50) konsol.removeChild(konsol.lastChild);
        }

        socket.on('arduinoDurum', (bagliMi) => {
            if (bagliMi) {
                arduinoRozet.innerText = "ARDUINO: ONLINE";
                arduinoRozet.className = "durum-rozeti bagli";
                logMesaj("Donanım bağlantısı sağlandı.", "sistem");
            } else {
                arduinoRozet.innerText = "ARDUINO: OFFLINE";
                arduinoRozet.className = "durum-rozeti kopuk";
                logMesaj("Bağlantı koptu! Yeniden deneniyor...", "hata");
            }
        });

        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(function (stream) {
                video.srcObject = stream;
                logMesaj("Kamera akışı aktif (640x480).", "sistem");
            })
            .catch(function (err) {
                secimMetni.innerText = "Kamera İzni Gerekli!";
                logMesaj("Kamera hatası: " + err.message, "hata");
            });

        function sistemHazir() {
            logMesaj("OpenCV.js yüklendi, yapay görme aktif.", "sistem");
            islemBasladi = true;

            const baslat = () => {
                logMesaj("Analiz motoru tetiklendi.", "sistem");
                secimMetni.innerText = "SİSTEM AKTİF: Hedef seçimi bekleniyor...";
                requestAnimationFrame(goruntuIsle);
            };

            if (!video.paused) {
                baslat();
            } else {
                video.addEventListener('play', baslat);
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clickX = (e.clientX - rect.left) * scaleX;
            const clickY = (e.clientY - rect.top) * scaleY;

            for (let i = 0; i < anlikHedefler.length; i++) {
                let h = anlikHedefler[i];
                if (clickX >= h.x && clickX <= h.x + h.w && clickY >= h.y && clickY <= h.y + h.h) {
                    seciliHedefKodu = h.id;
                    let merkezX = Math.round(h.x + (h.w / 2));
                    let merkezY = Math.round(h.y + (h.h / 2));

                    bekleyenHedef = { isim: h.isim, x: merkezX, y: merkezY };
                    secimMetni.innerHTML = `<span class="bekliyor">HEDEF SEÇİLDİ: ${h.isim} [${merkezX}, ${merkezY}]</span>`;
                    logMesaj(`Hedef belirlendi: ${h.isim}`, "sistem");
                    butonlarDiv.style.display = 'flex';
                    break;
                }
            }
        });

        document.getElementById('btnOnay').addEventListener('click', () => {
            if (bekleyenHedef) {
                secimMetni.innerHTML = `<span class="kilitli">ROBOT HAREKETTE: ${bekleyenHedef.isim}</span>`;
                logMesaj(`Kilitlenme onaylandı! Koordinatlara gidiliyor...`, "sistem");
                butonlarDiv.style.display = 'none';
                socket.emit('hedefKilitlendi', bekleyenHedef);
            }
        });

        document.getElementById('btnIptal').addEventListener('click', () => {
            logMesaj(`İşlem iptal edildi.`, "sistem");
            bekleyenHedef = null; seciliHedefKodu = null;
            secimMetni.innerText = `SİSTEM AKTİF: Hedef seçimi bekleniyor...`;
            butonlarDiv.style.display = 'none';
        });

        function goruntuIsle(now) {
            if (!islemBasladi) return;

            // FPS Hesaplama
            frameCount++;
            if (now - lastTime >= 1000) {
                fpsSayaci.innerText = "FPS: " + frameCount;
                frameCount = 0;
                lastTime = now;
            }

            try {
                let vW = video.videoWidth || 640;
                let vH = video.videoHeight || 480;
                let src = new cv.Mat(vH, vW, cv.CV_8UC4);
                let hsv = new cv.Mat();
                let cap = new cv.VideoCapture(video);

                cap.read(src);
                cv.cvtColor(src, hsv, cv.COLOR_RGBA2RGB);
                cv.cvtColor(hsv, hsv, cv.COLOR_RGB2HSV);

                let altBeyaz = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, 200, 0]);
                let ustBeyaz = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, 40, 255, 0]);
                let maskeBeyaz = new cv.Mat();
                cv.inRange(hsv, altBeyaz, ustBeyaz, maskeBeyaz);

                let altSiyah = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [0, 0, 0, 0]);
                let ustSiyah = new cv.Mat(hsv.rows, hsv.cols, hsv.type(), [180, 255, 50, 0]);
                let maskeSiyah = new cv.Mat();
                cv.inRange(hsv, altSiyah, ustSiyah, maskeSiyah);

                anlikHedefler = [];

                function sekilleriBulVeCiz(maske, renkAdi) {
                    let kernel = cv.Mat.ones(5, 5, cv.CV_8U);
                    cv.morphologyEx(maske, maske, cv.MORPH_CLOSE, kernel);
                    cv.morphologyEx(maske, maske, cv.MORPH_OPEN, kernel);
                    kernel.delete();

                    let contours = new cv.MatVector();
                    let hierarchy = new cv.Mat();
                    cv.findContours(maske, contours, hierarchy, cv.RETR_EXTERNAL, cv.CHAIN_APPROX_SIMPLE);

                    for (let i = 0; i < contours.size(); ++i) {
                        let cnt = contours.get(i);
                        let alan = cv.contourArea(cnt);
                        if (alan > 1500 && alan < 200000) {
                            let cevre = cv.arcLength(cnt, true);
                            let dairesellik = (4 * Math.PI * alan) / (cevre * cevre);
                            let poly = new cv.Mat();
                            cv.approxPolyDP(cnt, poly, 0.04 * cevre, true);
                            let koseSayisi = poly.rows;
                            let kutu = cv.boundingRect(poly);
                            let sekilAdi = null;

                            if (dairesellik > 0.8) sekilAdi = "Daire";
                            else if (koseSayisi === 3) sekilAdi = "Ucgen";
                            else if (koseSayisi === 4) {
                                let orant = kutu.width / kutu.height;
                                sekilAdi = (orant >= 0.8 && orant <= 1.2) ? "Kare" : "Dikdortgen";
                            }

                            if (sekilAdi !== null) {
                                let mX, mY;
                                let benzersizId = renkAdi + "-" + i;
                                let kilitliMi = (seciliHedefKodu === benzersizId);
                                let renk = kilitliMi ? [255, 0, 60, 255] : [0, 255, 0, 255];
                                let kalinlik = kilitliMi ? 2 : 1;

                                if (sekilAdi === "Daire") {
                                    // Daireler için tam çember çizimi
                                    let circle = cv.minEnclosingCircle(cnt);
                                    mX = Math.round(circle.center.x);
                                    mY = Math.round(circle.center.y);
                                    let radius = Math.round(circle.radius);
                                    cv.circle(src, new cv.Point(mX, mY), radius, renk, kalinlik);
                                } else {
                                    // Diğer şekiller için döndürülmüş dikdörtgen çizimi
                                    let rotatedRect = cv.minAreaRect(cnt);
                                    let vertices = cv.RotatedRect.points(rotatedRect);
                                    mX = Math.round(rotatedRect.center.x);
                                    mY = Math.round(rotatedRect.center.y);
                                    for (let j = 0; j < 4; j++) {
                                        cv.line(src, vertices[j], vertices[(j + 1) % 4], renk, kalinlik);
                                    }
                                }

                                let tamIsim = renkAdi + " " + sekilAdi;
                                anlikHedefler.push({
                                    id: benzersizId,
                                    isim: tamIsim,
                                    x: mX - 20, y: mY - 20, w: 40, h: 40
                                });

                                // Hedef İşareti (Crosshair)
                                let cSize = 8;
                                cv.line(src, new cv.Point(mX - cSize, mY), new cv.Point(mX + cSize, mY), renk, 1);
                                cv.line(src, new cv.Point(mX, mY - cSize), new cv.Point(mX, mY + cSize), renk, 1);

                                if (kilitliMi) {
                                    cv.circle(src, new cv.Point(mX, mY), 12, renk, 1);
                                }

                                cv.putText(src, tamIsim, new cv.Point(mX - 30, mY - 20), cv.FONT_HERSHEY_SIMPLEX, 0.4, renk, 1);
                            }
                            poly.delete();
                        }
                    }
                    contours.delete(); hierarchy.delete();
                }

                sekilleriBulVeCiz(maskeBeyaz, "Beyaz");
                sekilleriBulVeCiz(maskeSiyah, "Siyah");

                cv.imshow('cikisEkrani', src);

                src.delete(); hsv.delete();
                maskeBeyaz.delete(); altBeyaz.delete(); ustBeyaz.delete();
                maskeSiyah.delete(); altSiyah.delete(); ustSiyah.delete();

            } catch (err) { console.error(err); }
            requestAnimationFrame(goruntuIsle);
        }
    </script>
</body>

</html>
